# EDIM DDE API on Databricks Apps
# Docs: edim-dde-domain/docs/api/deploy-and-hosting.md
#
# Port: Databricks substitutes $DATABRICKS_APP_PORT at runtime.
# Also sets UVICORN_HOST / UVICORN_PORT for FastAPI.

command:
  - uvicorn
  - edim_dde_api.main:app
  - --host
  - "0.0.0.0"
  - --port
  - "$DATABRICKS_APP_PORT"

env:
  # --- Environment label (tracing / ops) ---
  - name: EDIM_ENV
    value: "dev"

  # --- Startup validation (optional; recommend on DEV/PROD) ---
  - name: EDIM_STRICT_STARTUP
    value: "1"
  - name: EDIM_REQUIRE_SQL
    value: "1"

  # --- Databricks SQL warehouse ---
  # Prefer Apps resource bindings / workspace defaults where available.
  - name: DATABRICKS_HOST
    value: "adb-1137828170459102.2.azuredatabricks.net"
  - name: DATABRICKS_HTTP_PATH
    value: "/sql/1.0/warehouses/a37a133da7c13757"
  - name: DATABRICKS_JOB_CLUSTER_METRICS_TABLE
    value: "dim_engineering_dev.maintenance_audit.dbx_job_cluster_metrics_all"
  - name: DATABRICKS_SPARK_METRICS_TABLE
    value: "dim_engineering_dev.maintenance_audit.spark_metrics"
  - name: DATABRICKS_SPARK_LOGS_TABLE
    value: "dim_engineering_dev.maintenance_audit.spark_logs"

  # --- Azure AI Foundry (LLM) ---
  - name: AZURE_OPENAI_ENDPOINT
    value: "https://aiplatform-dev-eus-aif-06.services.ai.azure.com/openai/v1"
  - name: AZURE_OPENAI_DEPLOYMENT_NAME
    value: "cc9815-ets-dae-gpt-5.4"
  # Tenant GUID (not secret) — required if App SP opens Key Vault via DATABRICKS_CLIENT_*
  - name: AZURE_TENANT_ID
    value: "4cb791f1-02d1-4a4e-8610-911ee57bb08c"
  # Preferred: load Foundry SP from Key Vault → EDIM_FOUNDRY_* (default secret map)
  - name: AZURE_KEY_VAULT_URL
    value: "https://dlabs-dev-eus-app-a-kv.vault.azure.net/"
  # Do NOT set AZURE_CLIENT_ID/SECRET for Foundry (pollutes SQL DefaultAzureCredential).
  # Do NOT set EDIM_FOUNDRY_* here when using KV — vault injects them.
  # Alternative: Apps secrets UI injects EDIM_FOUNDRY_CLIENT_ID/SECRET/TENANT_ID;
  # leave AZURE_KEY_VAULT_URL unset.

  # Map vault secret names -> runtime env names expected by Foundry auth
  - name: EDIM_KV_SECRET_MAP
    value: "DLABS-DIM-ADB-APP-AIF-APPID:EDIM_FOUNDRY_CLIENT_ID,DLABS-DIM-ADB-APP-AIF-APPKEY:EDIM_FOUNDRY_CLIENT_SECRET"

  # --- Optional planes (safe defaults for first cut) ---
  - name: EDIM_OBSERVABILITY
    value: "none"
  - name: EDIM_STATE_STORE
    value: "memory"
  - name: EDIM_RETRIEVAL
    value: "none"

  # --- CORS (only if a browser UI calls this App) ---
  # - name: EDIM_CORS_ORIGINS
  #   value: "https://your-ui.example.com"
