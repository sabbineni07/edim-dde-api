[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edim-dde-api"
version = "1.0.0"
description = "Thin FastAPI over edim-dde-domain YAML agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  # Published later (private index): "edim-dde-domain>=1.0.0", "edim-dde-ai>=1.0.0"
  # Local/dev: requirements.txt -e ../  (see docs/contribute/packaging.md)
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/edim_dde_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
